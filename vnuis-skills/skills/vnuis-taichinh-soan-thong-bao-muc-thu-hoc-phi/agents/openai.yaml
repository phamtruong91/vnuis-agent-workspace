interface:
  display_name: Tài chính · Soạn thông báo mức thu học phí / lệ phí – VNU-IS
  short_description: Hỗ trợ soạn thông báo mức thu học phí / lệ phí (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-taichinh-soan-thong-bao-muc-thu-hoc-phi để hỗ trợ công việc: Soạn thông báo mức thu học phí / lệ phí; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
