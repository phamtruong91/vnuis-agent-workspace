interface:
  display_name: Truyền thông · Xây dựng kịch bản lễ tân, khánh tiết – VNU-IS
  short_description: Hỗ trợ xây dựng kịch bản lễ tân, khánh tiết (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-tt-kich-ban-khanh-tiet để hỗ trợ công việc: Xây dựng kịch bản lễ tân, khánh tiết; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
