  default_prompt: 'Hãy dùng $vnuis-ctsv-khao-sat-viec-lam-sau-tot-nghiep để hỗ trợ công việc: Khảo sát tình trạng việc làm sinh viên sau tốt nghiệp; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
