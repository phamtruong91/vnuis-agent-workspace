interface:
  display_name: Dùng chung · Quản lý file & phiên bản (chỉ đọc) – VNU-IS
  short_description: Hỗ trợ quản lý file & phiên bản (chỉ đọc) (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-dc-quan-ly-phien-ban-tai-lieu để hỗ trợ công việc: Quản lý file & phiên bản (chỉ đọc); xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .xlsx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
