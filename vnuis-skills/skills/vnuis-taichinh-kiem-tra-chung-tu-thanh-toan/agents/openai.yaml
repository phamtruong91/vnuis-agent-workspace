interface:
  display_name: Tài chính · Lập danh mục kiểm tra chứng từ thanh toán – VNU-IS
  short_description: Hỗ trợ lập danh mục kiểm chứng từ thanh toán (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-taichinh-kiem-tra-chung-tu-thanh-toan để hỗ trợ công việc: Lập danh mục kiểm chứng từ thanh toán; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .xlsx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
