interface:
  display_name: Văn phòng · Hợp nhất báo cáo nhiều đơn vị – VNU-IS
  short_description: Hỗ trợ hợp nhất báo cáo nhiều đơn vị (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-vp-hop-nhat-bao-cao-don-vi để hỗ trợ công việc: Hợp nhất báo cáo nhiều đơn vị; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
