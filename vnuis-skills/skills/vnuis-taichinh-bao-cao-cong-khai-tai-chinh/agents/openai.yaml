interface:
  display_name: Tài chính · Soạn báo cáo công khai tài chính – VNU-IS
  short_description: Hỗ trợ soạn báo cáo công khai tài chính (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-taichinh-bao-cao-cong-khai-tai-chinh để hỗ trợ công việc: Soạn báo cáo công khai tài chính; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
