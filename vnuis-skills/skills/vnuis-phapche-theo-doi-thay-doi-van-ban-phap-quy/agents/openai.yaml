interface:
  display_name: Pháp chế · Theo dõi thay đổi văn bản pháp quy – VNU-IS
  short_description: Hỗ trợ theo dõi thay đổi văn bản pháp quy (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-phapche-theo-doi-thay-doi-van-ban-phap-quy để hỗ trợ công việc: Theo dõi thay đổi văn bản pháp quy; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
