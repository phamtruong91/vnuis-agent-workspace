interface:
  display_name: Đào tạo · Đối chiếu học phần chuyển tiếp VNU-IS
  short_description: Đối chiếu học phần chuyển tiếp VNU-IS
  default_prompt: 'Hãy dùng $vnuis-dt-doi-chieu-cong-nhan-tin-chi để hỗ trợ công việc: Đối chiếu học phần khi công nhận chuyển tiếp của Trường Quốc tế – ĐHQGHN; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .xlsx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
