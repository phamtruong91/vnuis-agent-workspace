interface:
  display_name: ĐBCL · Kế hoạch cải tiến chất lượng – VNU-IS
  short_description: Hỗ trợ kế hoạch cải tiến chất lượng (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-dbcl-ke-hoach-cai-tien-chat-luong để hỗ trợ công việc: Kế hoạch cải tiến chất lượng; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
