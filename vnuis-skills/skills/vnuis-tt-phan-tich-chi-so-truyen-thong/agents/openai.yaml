interface:
  display_name: Truyền thông · Phân tích chỉ số truyền thông VNU-IS
  short_description: Phân tích chỉ số truyền thông VNU-IS
  default_prompt: 'Hãy dùng $vnuis-tt-phan-tich-chi-so-truyen-thong để hỗ trợ công việc: Phân tích chỉ số truyền thông của Trường Quốc tế – ĐHQGHN; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .xlsx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
