interface:
  display_name: Hợp tác QT · Kế hoạch đoàn ra / đoàn vào – VNU-IS
  short_description: Hỗ trợ kế hoạch đoàn ra / đoàn vào (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-htqt-ke-hoach-doan-ra-vao để hỗ trợ công việc: Kế hoạch đoàn ra / đoàn vào; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
