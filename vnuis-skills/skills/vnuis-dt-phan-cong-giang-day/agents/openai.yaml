  short_description: Hỗ trợ phân công giảng dạy học kỳ (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-dt-phan-cong-giang-day để hỗ trợ công việc: Phân công giảng dạy học kỳ; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .xlsx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
