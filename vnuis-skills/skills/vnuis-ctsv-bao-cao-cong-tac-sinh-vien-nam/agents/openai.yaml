interface:
  display_name: Công tác SV · Soạn báo cáo công tác sinh viên năm học – VNU-IS
  short_description: Hỗ trợ soạn báo cáo công tác sinh viên năm học (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-ctsv-bao-cao-cong-tac-sinh-vien-nam để hỗ trợ công việc: Soạn báo cáo công tác sinh viên năm học; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
