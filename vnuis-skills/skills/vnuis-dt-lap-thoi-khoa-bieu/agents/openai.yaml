interface:
  display_name: Đào tạo · Lập thời khóa biểu học kỳ – VNU-IS
  short_description: Hỗ trợ lập thời khóa biểu học kỳ (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-dt-lap-thoi-khoa-bieu để hỗ trợ công việc: Lập thời khóa biểu học kỳ; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .xlsx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
