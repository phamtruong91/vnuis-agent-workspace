interface:
  display_name: Công tác SV · Tổng hợp điểm rèn luyện toàn trường theo học kỳ – VNU-IS
  short_description: Hỗ trợ tổng hợp điểm rèn luyện toàn trường theo học kỳ (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-ctsv-tong-hop-diem-ren-luyen để hỗ trợ công việc: Tổng hợp điểm rèn luyện toàn trường theo học kỳ; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .xlsx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
