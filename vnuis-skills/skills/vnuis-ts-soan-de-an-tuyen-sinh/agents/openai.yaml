interface:
  display_name: Tuyển sinh · Soạn đề án tuyển sinh hằng năm – VNU-IS
  short_description: Hỗ trợ soạn đề án tuyển sinh hằng năm (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-ts-soan-de-an-tuyen-sinh để hỗ trợ công việc: Soạn đề án tuyển sinh hằng năm; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
