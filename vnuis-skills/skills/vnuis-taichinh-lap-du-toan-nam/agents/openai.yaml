interface:
  display_name: Tài chính · Lập dự toán thu – chi ngân sách năm – VNU-IS
  short_description: Hỗ trợ lập dự toán thu – chi ngân sách năm (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-taichinh-lap-du-toan-nam để hỗ trợ công việc: Lập dự toán thu – chi ngân sách năm; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .xlsx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
