interface:
  display_name: Đào tạo · Tổng hợp số liệu 3 công khai mảng đào tạo – VNU-IS
  short_description: Hỗ trợ tổng hợp số liệu 3 công khai mảng đào tạo (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-dt-tong-hop-so-lieu-3-cong-khai để hỗ trợ công việc: Tổng hợp số liệu 3 công khai mảng đào tạo; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .xlsx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
