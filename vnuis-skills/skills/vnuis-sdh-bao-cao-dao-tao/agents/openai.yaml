interface:
  display_name: Sau đại học · Báo cáo đào tạo sau đại học hằng năm – VNU-IS
  short_description: Hỗ trợ báo cáo đào tạo sau đại học hằng năm (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-sdh-bao-cao-dao-tao để hỗ trợ công việc: Báo cáo đào tạo sau đại học hằng năm; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
