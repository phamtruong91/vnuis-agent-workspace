interface:
  display_name: ĐBCL · Lập danh mục minh chứng kiểm định – VNU-IS
  short_description: Hỗ trợ danh mục kiểm minh chứng kiểm định (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-dbcl-lap-danh-muc-minh-chung để hỗ trợ công việc: Danh mục kiểm minh chứng kiểm định; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .xlsx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
