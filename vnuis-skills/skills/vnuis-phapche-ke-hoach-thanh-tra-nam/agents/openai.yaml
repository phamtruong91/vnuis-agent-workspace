interface:
  display_name: Pháp chế · Lập kế hoạch thanh tra nội bộ năm – VNU-IS
  short_description: Hỗ trợ lập kế hoạch thanh tra nội bộ năm (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-phapche-ke-hoach-thanh-tra-nam để hỗ trợ công việc: Lập kế hoạch thanh tra nội bộ năm; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
