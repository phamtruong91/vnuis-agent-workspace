interface:
  display_name: Đào tạo · Xây dựng khung chương trình đào tạo – VNU-IS
  short_description: Hỗ trợ xây dựng khung chương trình đào tạo (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-dt-xay-dung-khung-chuong-trinh để hỗ trợ công việc: Xây dựng khung chương trình đào tạo; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
