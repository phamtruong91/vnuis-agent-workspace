interface:
  display_name: CNTT · Báo cáo hiện trạng & kết quả chuyển đổi số – VNU-IS
  short_description: Hỗ trợ báo cáo hiện trạng & kết quả chuyển đổi số (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-cntt-bao-cao-chuyen-doi-so để hỗ trợ công việc: Báo cáo hiện trạng & kết quả chuyển đổi số; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
