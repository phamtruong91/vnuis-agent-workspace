interface:
  display_name: Nhân sự · Báo cáo tổng kết công tác thi đua, khen thưởng – VNU-IS
  short_description: Hỗ trợ báo cáo tổng kết công tác thi đua, khen thưởng (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-nhansu-bao-cao-thi-dua-khen-thuong để hỗ trợ công việc: Báo cáo tổng kết công tác thi đua, khen thưởng; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
