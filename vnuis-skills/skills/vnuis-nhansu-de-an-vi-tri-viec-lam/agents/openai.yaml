interface:
  display_name: Nhân sự · Xây dựng đề án vị trí việc làm – VNU-IS
  short_description: Hỗ trợ xây dựng đề án vị trí việc làm (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-nhansu-de-an-vi-tri-viec-lam để hỗ trợ công việc: Xây dựng đề án vị trí việc làm; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
