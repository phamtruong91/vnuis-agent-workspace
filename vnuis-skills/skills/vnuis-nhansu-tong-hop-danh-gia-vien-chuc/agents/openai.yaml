interface:
  display_name: Nhân sự · Tổng hợp kết quả đánh giá viên chức toàn trường – VNU-IS
  short_description: Hỗ trợ tổng hợp kết quả đánh giá viên chức toàn trường (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-nhansu-tong-hop-danh-gia-vien-chuc để hỗ trợ công việc: Tổng hợp kết quả đánh giá viên chức toàn trường; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
