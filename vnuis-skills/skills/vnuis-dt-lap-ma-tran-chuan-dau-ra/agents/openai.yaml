interface:
  display_name: Đào tạo · Lập ma trận đối sánh chuẩn đầu ra học phần – chương trình (CLO–PLO) – VNU-IS
  short_description: Hỗ trợ lập ma trận đối sánh chuẩn đầu ra học phần – chương trình
  default_prompt: 'Hãy dùng $vnuis-dt-lap-ma-tran-chuan-dau-ra để hỗ trợ công việc: Lập ma trận đối sánh chuẩn đầu ra học phần – chương trình (CLO–PLO); xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .xlsx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
