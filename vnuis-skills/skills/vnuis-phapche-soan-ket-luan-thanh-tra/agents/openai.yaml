  default_prompt: 'Hãy dùng $vnuis-phapche-soan-ket-luan-thanh-tra để hỗ trợ công việc: Soạn kết luận thanh tra; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
