interface:
  display_name: Văn phòng · Soạn thông báo – VNU-IS
  short_description: Hỗ trợ soạn thông báo cho VNU-IS (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-vp-soan-thong-bao để hỗ trợ công việc: Soạn thông báo; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
