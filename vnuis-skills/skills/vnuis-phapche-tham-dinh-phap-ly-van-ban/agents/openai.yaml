interface:
  display_name: Pháp chế · Thẩm định pháp lý dự thảo văn bản nội bộ – VNU-IS
  short_description: Hỗ trợ thẩm định pháp lý dự thảo văn bản nội bộ (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-phapche-tham-dinh-phap-ly-van-ban để hỗ trợ công việc: Thẩm định pháp lý dự thảo văn bản nội bộ; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
