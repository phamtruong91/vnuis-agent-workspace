interface:
  display_name: Tuyển sinh · Báo cáo kết quả tuyển sinh gửi cơ quan tiếp nhận – VNU-IS
  short_description: Hỗ trợ báo cáo kết quả tuyển sinh gửi cơ quan tiếp nhận (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-ts-bao-cao-ket-qua-tuyen-sinh để hỗ trợ công việc: Báo cáo kết quả tuyển sinh gửi cơ quan tiếp nhận; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
