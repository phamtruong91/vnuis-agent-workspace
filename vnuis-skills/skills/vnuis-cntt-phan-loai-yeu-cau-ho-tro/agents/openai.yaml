interface:
  display_name: CNTT · Phân loại yêu cầu hỗ trợ CNTT – VNU-IS
  short_description: Hỗ trợ hỗ trợ người dùng CNTT (triage) (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-cntt-phan-loai-yeu-cau-ho-tro để hỗ trợ công việc: Hỗ trợ người dùng CNTT (triage); xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
