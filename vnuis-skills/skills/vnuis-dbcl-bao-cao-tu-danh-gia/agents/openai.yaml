interface:
  display_name: ĐBCL · Báo cáo tự đánh giá (kiểm định chất lượng) – VNU-IS
  short_description: Hỗ trợ báo cáo tự đánh giá (kiểm định chất lượng) (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-dbcl-bao-cao-tu-danh-gia để hỗ trợ công việc: Báo cáo tự đánh giá (kiểm định chất lượng); xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
