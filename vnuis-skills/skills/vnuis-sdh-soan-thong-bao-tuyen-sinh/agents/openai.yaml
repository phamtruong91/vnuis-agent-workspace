interface:
  display_name: Sau đại học · Thông báo tuyển sinh thạc sĩ / tiến sĩ – VNU-IS
  short_description: Hỗ trợ thông báo tuyển sinh thạc sĩ / tiến sĩ (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-sdh-soan-thong-bao-tuyen-sinh để hỗ trợ công việc: Thông báo tuyển sinh thạc sĩ / tiến sĩ; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
