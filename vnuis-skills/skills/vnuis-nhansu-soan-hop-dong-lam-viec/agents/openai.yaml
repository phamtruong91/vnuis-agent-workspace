interface:
  display_name: Nhân sự · Soạn hợp đồng làm việc / hợp đồng lao động – VNU-IS
  short_description: Hỗ trợ soạn hợp đồng làm việc / hợp đồng lao động (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-nhansu-soan-hop-dong-lam-viec để hỗ trợ công việc: Soạn hợp đồng làm việc / hợp đồng lao động; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
