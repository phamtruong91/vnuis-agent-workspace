interface:
  display_name: Truyền thông · Lịch nội dung truyền thông – VNU-IS
  short_description: Hỗ trợ nội dung calendar truyền thông (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-tt-lap-lich-noi-dung để hỗ trợ công việc: Nội dung calendar truyền thông; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .xlsx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
