interface:
  display_name: Công tác SV · Phân loại yêu cầu của sinh viên – VNU-IS
  short_description: Hỗ trợ phân loại case sinh viên (triage) (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-ctsv-phan-loai-yeu-cau-sinh-vien để hỗ trợ công việc: Phân loại case sinh viên (triage); xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
