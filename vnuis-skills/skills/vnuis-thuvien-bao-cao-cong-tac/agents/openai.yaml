interface:
  display_name: Thư viện · Báo cáo công tác thư viện – VNU-IS
  short_description: Hỗ trợ báo cáo công tác thư viện (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-thuvien-bao-cao-cong-tac để hỗ trợ công việc: Báo cáo công tác thư viện; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
