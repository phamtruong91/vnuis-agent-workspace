interface:
  display_name: KHCN · Hồ sơ đăng ký sáng chế / giải pháp hữu ích – VNU-IS
  short_description: Hỗ trợ hồ sơ đăng ký sáng chế / giải pháp hữu ích (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-khcn-lap-ho-so-so-huu-tri-tue để hỗ trợ công việc: Hồ sơ đăng ký sáng chế / giải pháp hữu ích; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
