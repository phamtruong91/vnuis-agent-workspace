interface:
  display_name: Khoa · Báo cáo tổng kết năm học của khoa – VNU-IS
  short_description: Hỗ trợ báo cáo tổng kết năm học của khoa (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-khoa-bao-cao-tong-ket-nam-hoc để hỗ trợ công việc: Báo cáo tổng kết năm học của khoa; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
