interface:
  display_name: Đào tạo · Soạn/sửa đổi quy chế đào tạo của trường – VNU-IS
  short_description: Hỗ trợ soạn/sửa đổi quy chế đào tạo của trường (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-dt-soan-quy-che-dao-tao để hỗ trợ công việc: Soạn/sửa đổi quy chế đào tạo của trường; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
