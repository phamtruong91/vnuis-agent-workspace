interface:
  display_name: Tuyển sinh · Theo dõi phễu thí sinh – VNU-IS
  short_description: Hỗ trợ funnel theo dõi thí sinh (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-ts-theo-doi-pheu-thi-sinh để hỗ trợ công việc: Funnel theo dõi thí sinh; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .xlsx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
