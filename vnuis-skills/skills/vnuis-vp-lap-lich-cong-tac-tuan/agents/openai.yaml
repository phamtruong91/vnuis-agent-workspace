interface:
  display_name: Văn phòng · Lập lịch công tác tuần – VNU-IS
  short_description: Hỗ trợ lập lịch công tác tuần (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-vp-lap-lich-cong-tac-tuan để hỗ trợ công việc: Lập lịch công tác tuần; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .xlsx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
