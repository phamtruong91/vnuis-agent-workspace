interface:
  display_name: Đào tạo · Báo cáo công tác đào tạo định kỳ – VNU-IS
  short_description: Hỗ trợ báo cáo công tác đào tạo định kỳ (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-dt-bao-cao-dao-tao-dinh-ky để hỗ trợ công việc: Báo cáo công tác đào tạo định kỳ; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
