interface:
  display_name: Dùng chung · Kiểm tra chất lượng dữ liệu VNU-IS
  short_description: Kiểm tra dữ liệu báo cáo cho VNU-IS
  default_prompt: 'Hãy dùng $vnuis-dc-kiem-tra-chat-luong-du-lieu-bao-cao để hỗ trợ công việc: Kiểm tra chất lượng dữ liệu báo cáo của Trường Quốc tế – ĐHQGHN; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .xlsx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
