interface:
  display_name: Văn phòng · Tóm tắt trình lãnh đạo – VNU-IS
  short_description: Hỗ trợ bản tóm tắt cho lãnh đạo trình lãnh đạo (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-vp-tom-tat-trinh-lanh-dao để hỗ trợ công việc: Bản tóm tắt cho lãnh đạo trình lãnh đạo; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
