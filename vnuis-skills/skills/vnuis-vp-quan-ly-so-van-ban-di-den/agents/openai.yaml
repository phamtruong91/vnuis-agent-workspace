interface:
  display_name: Văn phòng · Quản lý sổ văn bản đi / đến – VNU-IS
  short_description: Hỗ trợ quản lý sổ văn bản đi / đến (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-vp-quan-ly-so-van-ban-di-den để hỗ trợ công việc: Quản lý sổ văn bản đi / đến; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .xlsx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
