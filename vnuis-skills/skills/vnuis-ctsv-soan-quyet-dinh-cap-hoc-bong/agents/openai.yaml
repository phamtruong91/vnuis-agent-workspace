interface:
  display_name: Công tác SV · Soạn quyết định cấp học bổng / miễn giảm học phí – VNU-IS
  short_description: Hỗ trợ soạn quyết định cấp học bổng / miễn giảm học phí (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-ctsv-soan-quyet-dinh-cap-hoc-bong để hỗ trợ công việc: Soạn quyết định cấp học bổng / miễn giảm học phí; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
