interface:
  display_name: Tuyển sinh · Hỏi đáp tuyển sinh – VNU-IS
  short_description: Hỗ trợ fAQ tuyển sinh cho VNU-IS (VNU-IS)
  default_prompt: 'Hãy dùng $vnuis-ts-hoi-dap-tuyen-sinh để hỗ trợ công việc: hỏi đáp tuyển sinh; xác nhận dữ liệu, căn cứ hiện hành và xuất dự thảo để kiểm duyệt. Tạo file .docx thực tế và cung cấp liên kết tải; không chỉ trả nội dung trong chat. Giữ chỗ điền thông tin thiếu đúng mẫu. Đọc references/boi-canh-vnuis.md và các mục chờ xác nhận trước khi làm.'
